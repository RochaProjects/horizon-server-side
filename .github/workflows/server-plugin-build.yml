name: server plugin build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-plugin-build-${{ github.ref }}
  cancel-in-progress: false

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-server-plugin-rust-1.99-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-server-plugin-rust-1.99-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-server-plugin-rust-1.99-

      - name: Build and link the dedicated-server engine with plugin host
        run: cargo build --locked --release -p horizon-client --no-default-features --features server-plugins --bin horizon-client

      - name: Build and link Aura Loja as a separate shared library
        run: cargo build --locked --release -p horizon-plugin-aura-loja

      - name: Confirm both binaries were produced
        run: |
          test -x target/release/horizon-client
          test -f target/release/libhorizon_plugin_aura_loja.so
