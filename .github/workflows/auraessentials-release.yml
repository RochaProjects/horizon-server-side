name: AuraEssentials server release

on:
  push:
    tags: ["aura-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag already pushed (for example aura-v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: auraessentials-release
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Rust and native build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Build AuraEssentials into the pinned Horizon engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_NO_DEFAULT_FEATURES: "1"
        run: python3 native/tools/native.py build auraessentials --horizon ac2603ed41953f1b8b791ca8396a0eb5147baea7 | tee native-build.json

      - name: Build matching server tools and Java exporters
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/horizon-base-target
        run: |
          set -euo pipefail
          source="native/target/horizon/ac2603ed41953f1b8b791ca8396a0eb5147baea7"
          cargo build --manifest-path "$source/Cargo.toml" --locked --release -p horizon-server -p horizon-prepare
          exporter_bundle=$("$CARGO_TARGET_DIR/release/horizon-prepare" compile-exporters --root "$source" | tail -n 1)
          test -f "$exporter_bundle/manifest.json"
          mkdir -p dist/auraessentials-server/exporters
          cp "$CARGO_TARGET_DIR/release/horizon-server" dist/auraessentials-server/
          cp "$CARGO_TARGET_DIR/release/horizon-prepare" dist/auraessentials-server/
          cp "$source/research-lock.json" "$source/LICENSE" dist/auraessentials-server/
          cp -R "$exporter_bundle/server" "$exporter_bundle/client" "$exporter_bundle/manifest.json" dist/auraessentials-server/exporters/
          cp native/target/cargo/fast/horizon-client dist/auraessentials-server/horizon-engine
          chmod +x dist/auraessentials-server/horizon-server dist/auraessentials-server/horizon-prepare dist/auraessentials-server/horizon-engine
          printf '{"mod":"aura_essentials","version":"0.1.0","horizon":"ac2603ed41953f1b8b791ca8396a0eb5147baea7","minecraft":"26.3"}\n' > dist/auraessentials-server/auraessentials-release.json
          tar -czf dist/aura-essentials-server-linux-x86_64.tar.gz -C dist auraessentials-server
          sha256sum dist/aura-essentials-server-linux-x86_64.tar.gz > dist/aura-essentials-server-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^aura-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AuraEssentials ${tag#aura-v}" \
            --notes "Engine de servidor Horizon 26.3 com AuraEssentials integrado. Linux x86_64; inclui horizon-server, horizon-engine, horizon-prepare e os exporters necessários." \
            dist/aura-essentials-server-linux-x86_64.tar.gz \
            dist/aura-essentials-server-linux-x86_64.tar.gz.sha256
