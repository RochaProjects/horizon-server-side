[package]
name = "horizon-mod-aura-essentials"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "AuraEssentials: native Horizon server features based on the MIT-licensed Horizon SMP mod."

# The mod's rules and their tests: the same files the bundle adds to the game
# (as game::smp_store, game::smp_economy), under the same names.
[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
